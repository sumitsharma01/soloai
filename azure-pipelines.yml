# Credential-free validation only. Apply the reviewed Terraform plan from a
# private runner as described in docs/AZURE.md; never deploy the legacy Bicep here.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: [main]
pool:
  vmImage: ubuntu-latest
steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.13'
- script: |
    set -euo pipefail
    python -m pip install -r requirements.txt -r requirements-dev.txt
    pytest -q
    pip-audit -r requirements.txt
  displayName: Test application and audit dependencies
- bash: |
    set -euo pipefail
    mkdir -p "$AGENT_TEMPDIRECTORY/terraform-bin"
    cd "$AGENT_TEMPDIRECTORY/terraform-bin"
    curl -fsSLO https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_linux_amd64.zip
    curl -fsSLO https://releases.hashicorp.com/terraform/1.15.8/terraform_1.15.8_SHA256SUMS
    grep ' terraform_1.15.8_linux_amd64.zip$' terraform_1.15.8_SHA256SUMS | sha256sum -c -
    unzip -o terraform_1.15.8_linux_amd64.zip
    echo "##vso[task.prependpath]$AGENT_TEMPDIRECTORY/terraform-bin"
  displayName: Install checksum-verified Terraform
- script: |
    set -euo pipefail
    terraform -chdir=infra/terraform fmt -check -recursive
    terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
    terraform -chdir=infra/terraform validate
    terraform -chdir=infra/terraform test
  displayName: Validate private-edge infrastructure contracts
- script: docker build -t soloai:$(Build.BuildId) .
  displayName: Verify container build
