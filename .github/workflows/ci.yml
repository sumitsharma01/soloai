name: Test and audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
      - run: pip-audit -r requirements.txt
      - run: docker build -t soloai:test .

  terraform:
    name: Terraform configuration contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test

  foundry-agent:
    name: Foundry agent creation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r agents/soloai-support/requirements.txt
      - run: python agents/soloai-support/test_creator.py
      - run: python scripts/create_foundry_agent.py --model synthetic-ci-model
