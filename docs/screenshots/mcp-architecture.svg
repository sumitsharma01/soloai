<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="1100" height="730" fill="#f5f7fc"/><style>text{font-family:Arial,sans-serif;fill:#17243b}.title{font-size:27px;font-weight:bold}.sub{font-size:14px;fill:#58677b}.label{font-size:16px;font-weight:bold}.small{font-size:13px;fill:#58677b}</style><text x="45" y="50" class="title">SoloAI · Read-only booking with MCP</text><text x="45" y="80" class="sub">Shared Azure intelligence. Tenant-scoped tools. Human-reviewed drafts.</text><rect x="45" y="130" width="260" height="90" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="63" y="164" class="label">1. Gmail / Event API</text><text x="63" y="192" class="small">Authenticated email intake</text><rect x="400" y="130" width="280" height="90" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="418" y="164" class="label">2. SQL queue + worker</text><text x="418" y="192" class="small">Tenant context, budget, job state</text><rect x="770" y="130" width="285" height="90" rx="14" fill="#e9e7ff" stroke="#cbd5e1"/><text x="788" y="164" class="label">3. Azure Foundry</text><text x="788" y="192" class="small">Existing shared email agent</text><path d="M305,175 L400,175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="315" y="159" class="small">Enqueue</text><path d="M680,175 L770,175" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="695" y="159" class="small">Reason</text><rect x="400" y="305" width="280" height="90" rx="14" fill="#e6f4ed" stroke="#cbd5e1"/><text x="418" y="339" class="label">4. SoloAI tool gateway</text><text x="418" y="367" class="small">Permissions, limits, stop controls</text><path d="M910,220 L680,335" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="282" class="small">Requested tool</text><path d="M540,220 L540,305" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="552" y="270" class="small">Execute</text><rect x="45" y="305" width="260" height="90" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="63" y="339" class="label">Local policy lookup</text><text x="63" y="367" class="small">search_policy stays unchanged</text><path d="M400,350 L305,350" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="326" y="333" class="small">Policy</text><rect x="400" y="480" width="280" height="90" rx="14" fill="#e9e7ff" stroke="#cbd5e1"/><text x="418" y="514" class="label">5. MCP booking client</text><text x="418" y="542" class="small">Fixed get_booking + tenant token</text><path d="M540,395 L540,480" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="552" y="442" class="small">Approved call only</text><rect x="770" y="480" width="285" height="90" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="788" y="514" class="label">6. Booking MCP server</text><text x="788" y="542" class="small">Credential selects customer data</text><path d="M680,525 L770,525" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="697" y="507" class="small">HTTPS</text><rect x="770" y="305" width="285" height="90" rx="14" fill="#e6f4ed" stroke="#cbd5e1"/><text x="788" y="339" class="label">7. Draft → human review</text><text x="788" y="367" class="small">Validated results return to agent</text><path d="M910,480 L910,395" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="925" y="440" class="small">Validated result</text><text x="45" y="635" class="label">Kept simple</text><text x="45" y="662" class="sub">No new Azure service · No automatic sending · No booking writes · No model-selected endpoints</text><text x="45" y="692" class="small">Local demo: SQLite + loopback MCP. Production email queue: PostgreSQL. MCP server is operator-approved.</text></svg>